name: Canonical API Repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair canonical API paths and runtime configuration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          roots = [Path('api'), Path('src'), Path('web'), Path('tools'), Path('docs'), Path('scripts')]
          for root in roots:
              if not root.exists():
                  continue
              for p in root.rglob('*'):
                  if not p.is_file() or any(x in p.parts for x in ('node_modules','.git','.next')):
                      continue
                  try:
                      s = p.read_text()
                  except Exception:
                      continue
                  ns = s.replace('/api/v1/', '/api/')
                  ns = ns.replace('https://orbitfs.cc', '')
                  ns = ns.replace('new URL(req.url||"/","http://localhost")', 'new URL(req.url||"/", process.env.SITE_URL || "https://example.invalid")')
                  ns = ns.replace('new URL(req.url || "/", "http://localhost")', 'new URL(req.url || "/", process.env.SITE_URL || "https://example.invalid")')
                  if p.as_posix() == 'web/admin.html':
                      ns = ns.replace('V1-vercel-base / release-updates', 'V1-vercel-base / base-release')
                      ns = ns.replace('V1-vercel-base · release-updates', 'V1-vercel-base · base-release')
                  if p.as_posix() == 'api/release-control.ts':
                      ns = ns.replace('const input:Record<string,unknown>=await body(req);', 'const input:Record<string,unknown>=await body(req) as Record<string,unknown>;')
                      ns = ns.replace('new URL(req.url||"/","http://localhost")', 'new URL(req.url || "/", process.env.SITE_URL || "https://example.invalid")')
                  if p.as_posix() == 'src/server.ts':
                      old = '    if (!project) project = await vapi("/v11/projects", { method: "POST", body: JSON.stringify({ name: projectName, framework: "sveltekit" }) });\n'
                      new = old + '    if (!project) throw new Error("Unable to create Vercel project");\n    const activeProject = project;\n'
                      ns = ns.replace(old, new)
                      marker = '    const env = input.env && typeof input.env === "object" && !Array.isArray(input.env) ? input.env as JsonObject : {};\n'
                      before, sep, after = ns.partition(marker)
                      if sep:
                          segment, tail = after.split('async function syncDeployment', 1) if 'async function syncDeployment' in after else (after, '')
                          segment = segment.replace('project.id', 'activeProject.id').replace('project.name', 'activeProject.name')
                          after = segment + ('async function syncDeployment' + tail if tail else '')
                          ns = before + sep + after
                  if ns != s:
                      p.write_text(ns)
          PY
      - name: Verify canonical contract
        run: |
          ! grep -RInE '/api/v[0-9]+/|https://orbitfs\.cc|http://localhost|127\.0\.0\.1' api src web tools --exclude-dir=node_modules --exclude-dir=.next
          grep -RIn 'lucaskerim123/V1-vercel-base' api web scripts
          grep -RIn 'base-release' api web scripts
          grep -RIn 'lucaskerim123/V1-vercel-engine' api web scripts
          grep -RIn 'release-updates' api web scripts
      - name: Build and typecheck
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Commit repaired source and remove repair workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api src web tools docs scripts
          git rm -f .github/workflows/api-repair.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix canonical License Master API and release routing'
          git push
