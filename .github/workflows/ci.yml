name: License Master CI

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "src/**"
      - "web/**"
      - "migrations/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vercel.json"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "src/**"
      - "web/**"
      - "migrations/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vercel.json"
      - ".github/workflows/ci.yml"

concurrency:
  group: license-master-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
