name: Fix admin release labels

on:
  push:
    paths:
      - '.github/workflows/fix-admin-labels.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix release source labels and wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('web/admin.html')
          s = p.read_text()
          s = s.replace("releases:['Release system','Releases','Base source: base-release · update source: release-updates.']", "releases:['Release system','Releases','Base release source: V1-vercel-base · update release source: V1-vercel-engine / UPDATE_RELEASE.']")
          old = "async function loadReleaseSources(){try{const repo='lucaskerim123/V1-vercel-base';const branches=[['base-release','Base / clean installation'],['release-updates','Updates / existing installations']];const rows=await Promise.all(branches.map(async([branch,label])=>{const r=await fetch('https://api.github.com/repos/'+repo+'/commits?sha='+encodeURIComponent(branch)+'&per_page=1',{headers:{accept:'application/vnd.github+json'}});if(!r.ok)throw Error('Unable to read '+branch+' source');const j=await r.json();const c=j[0];return '<div class=\"source-chip\"><b>'+esc(label)+'</b><span>branch: '+esc(branch)+' · commit: '+esc(c?.sha?.slice(0,12)||'—')+' · '+esc(c?.commit?.message?.split('\\n')[0]||'No commits')+'</span></div>';}));$('releaseSources').innerHTML=rows.join('');}catch(e){$('releaseSources').innerHTML='<div class=\"source-chip\"><b>Release source unavailable</b><span>'+esc(e.message)+'</span></div>';}}"
          new = "async function loadReleaseSources(){try{const sources=[['lucaskerim123/V1-vercel-base','Base release source','MASTER_EDIT_SYSTEM'],['lucaskerim123/V1-vercel-engine','Update release source','UPDATE_RELEASE']];const rows=await Promise.all(sources.map(async([repo,label,branch])=>{const r=await fetch('https://api.github.com/repos/'+repo+'/commits?sha='+encodeURIComponent(branch)+'&per_page=1',{headers:{accept:'application/vnd.github+json'}});if(!r.ok)throw Error('Unable to read '+repo+' / '+branch);const j=await r.json();const c=j[0];return '<div class=\"source-chip\"><b>'+esc(label)+'</b><span>source: '+esc(repo)+' · branch: '+esc(branch)+' · commit: '+esc(c?.sha?.slice(0,12)||'—')+' · '+esc(c?.commit?.message?.split('\\n')[0]||'No commits')+'</span></div>';}));$('releaseSources').innerHTML=rows.join('');}catch(e){$('releaseSources').innerHTML='<div class=\"source-chip\"><b>Release source unavailable</b><span>'+esc(e.message)+'</span></div>';}}"
          if old not in s:
              raise SystemExit('Expected release-source function not found; refusing to modify admin.html')
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit corrected admin labels
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/admin.html
          git diff --cached --quiet || git commit -m 'Fix License Master release source labels'
          git push
