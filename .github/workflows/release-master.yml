name: OrbitFS Base Release Pipeline

on:
  workflow_dispatch:
  repository_dispatch:
    types: [orbitfs-base-release]

permissions:
  contents: read

env:
  MASTER_API_URL: ${{ secrets.MASTER_API_URL || 'https://www.incendiarynetworks.cc' }}
  MASTER_API_TOKEN: ${{ secrets.MASTER_API_TOKEN }}
  SOURCE_REPO: lucaskerim123/V1-vercel-base
  SOURCE_BRANCH: base-release
  SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
  RELEASE_VERSION: ${{ github.event.client_payload.version }}

concurrency:
  group: orbitfs-base-release
  cancel-in-progress: false

jobs:
  release:
    name: Capture and validate Base release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve current Base release
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SOURCE_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SOURCE_SHA:-}" ]]; then
            SOURCE_SHA=$(gh api repos/lucaskerim123/V1-vercel-base/git/ref/heads/base-release --jq '.object.sha')
          fi
          if [[ -z "${RELEASE_VERSION:-}" ]]; then
            RELEASE_VERSION=$(gh api 'repos/lucaskerim123/V1-vercel-base/contents/package.json?ref=base-release' --jq '.content' | base64 -d | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          fi
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid source commit SHA: $SOURCE_SHA"; exit 1; }
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid SemVer version: $RELEASE_VERSION"; exit 1; }
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved Base: $SOURCE_REPO / $SOURCE_BRANCH / $SOURCE_SHA / v$RELEASE_VERSION"

      - name: Checkout exact Base commit
        uses: actions/checkout@v4
        with:
          repository: lucaskerim123/V1-vercel-base
          ref: ${{ steps.resolve.outputs.source_sha }}
          token: ${{ secrets.SOURCE_GITHUB_TOKEN || github.token }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build release artifact
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.resolve.outputs.release_version }}
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run build
          rm -rf release-package
          mkdir -p release-package
          tar -czf "release-package/orbitfs-base-${RELEASE_VERSION}.tar.gz" \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./release-package' \
            .
          test -s "release-package/orbitfs-base-${RELEASE_VERSION}.tar.gz"
          sha256sum "release-package/orbitfs-base-${RELEASE_VERSION}.tar.gz"

      - name: Validate License Master connection
        shell: bash
        env:
          API_ROOT: ${{ env.MASTER_API_URL }}
          MASTER_TOKEN: ${{ env.MASTER_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$API_ROOT" ]] || { echo "MASTER_API_URL is not configured."; exit 1; }
          [[ -n "$MASTER_TOKEN" ]] || { echo "MASTER_API_TOKEN GitHub Actions secret is not configured."; exit 1; }
          API_ROOT="${API_ROOT%/}"
          API_ROOT="${API_ROOT%/api}"
          echo "License Master API: ${API_ROOT}/api"
          curl --fail-with-body -sS --connect-timeout 10 --max-time 30 "${API_ROOT}/api/health" \
            -H "Authorization: Bearer $MASTER_TOKEN" \
            -H "Accept: application/json" >/dev/null

      - name: Capture release in License Master
        id: capture
        shell: bash
        env:
          API_ROOT: ${{ env.MASTER_API_URL }}
          MASTER_TOKEN: ${{ env.MASTER_API_TOKEN }}
          SOURCE_SHA: ${{ steps.resolve.outputs.source_sha }}
          RELEASE_VERSION: ${{ steps.resolve.outputs.release_version }}
        run: |
          set -euo pipefail
          API_ROOT="${API_ROOT%/}"
          API_ROOT="${API_ROOT%/api}"
          RESPONSE=$(curl --fail-with-body -sS -X POST "${API_ROOT}/api/release-capture" \
            -H "Authorization: Bearer $MASTER_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"kind\":\"base\",\"version\":\"$RELEASE_VERSION\",\"sourceCommit\":\"$SOURCE_SHA\"}")
          echo "$RESPONSE" > release-capture.json
          RELEASE_ID=$(python3 -c 'import json; print(json.load(open("release-capture.json"))["release"]["id"])')
          [[ -n "$RELEASE_ID" ]] || { echo "License Master did not return a release ID."; exit 1; }
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Upload artifact to License Master
        env:
          API_ROOT: ${{ env.MASTER_API_URL }}
          MASTER_TOKEN: ${{ env.MASTER_API_TOKEN }}
          RELEASE_ID: ${{ steps.capture.outputs.release_id }}
        run: |
          set -euo pipefail
          API_ROOT="${API_ROOT%/}"
          API_ROOT="${API_ROOT%/api}"
          FILE=$(find release-package -type f -name '*.tar.gz' -print -quit)
          [[ -n "$FILE" && -s "$FILE" ]] || { echo "Release artifact was not created."; exit 1; }
          SHA=$(sha256sum "$FILE" | awk '{print $1}')
          curl --fail-with-body -sS -X POST "${API_ROOT}/api/v1/releases/$RELEASE_ID/artifact" \
            -H "Authorization: Bearer $MASTER_TOKEN" \
            -H "Content-Type: application/gzip" \
            -H "X-Artifact-SHA256: $SHA" \
            --data-binary "@$FILE"

      - name: Validate release in License Master
        env:
          API_ROOT: ${{ env.MASTER_API_URL }}
          MASTER_TOKEN: ${{ env.MASTER_API_TOKEN }}
          RELEASE_ID: ${{ steps.capture.outputs.release_id }}
        run: |
          set -euo pipefail
          API_ROOT="${API_ROOT%/}"
          API_ROOT="${API_ROOT%/api}"
          curl --fail-with-body -sS -X POST "${API_ROOT}/api/v1/releases/$RELEASE_ID/validate" \
            -H "Authorization: Bearer $MASTER_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}'

      - name: Leave release for manual Billing Store review
        env:
          RELEASE_VERSION: ${{ steps.resolve.outputs.release_version }}
        run: echo "Base release $RELEASE_VERSION is validated in License Master and remains pending manual Billing Store approval."
