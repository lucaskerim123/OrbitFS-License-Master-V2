name: OrbitFS Base Release Pipeline

on:
  repository_dispatch:
    types: [orbitfs-base-release]

permissions:
  contents: read

env:
  MASTER_API_URL: ${{ secrets.MASTER_API_URL }}
  MASTER_API_TOKEN: ${{ secrets.MASTER_API_TOKEN }}

concurrency:
  group: orbitfs-base-release
  cancel-in-progress: false

jobs:
  release:
    name: Capture and validate Base release
    runs-on: ubuntu-latest
    steps:
      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ github.event.client_payload.source_repo }}" == "lucaskerim123/V1-vercel-base" ]] || { echo "Invalid Base release source repository."; exit 1; }
          [[ "${{ github.event.client_payload.source_branch }}" == "base-release" ]] || { echo "Invalid Base release source branch."; exit 1; }
          [[ "${{ github.event.client_payload.source_sha }}" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid source commit SHA."; exit 1; }
          [[ "${{ github.event.client_payload.version }}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid SemVer version."; exit 1; }

      - name: Checkout exact Base commit
        uses: actions/checkout@v4
        with:
          repository: lucaskerim123/V1-vercel-base
          ref: ${{ github.event.client_payload.source_sha }}
          token: ${{ secrets.SOURCE_GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build release artifact
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run build
          mkdir -p release-package
          tar -czf "release-package/orbitfs-base-${{ github.event.client_payload.version }}.tar.gz" . --exclude=.git --exclude=node_modules --exclude=release-package
          sha256sum release-package/*

      - name: Capture release in License Master
        id: capture
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(curl --fail-with-body -sS -X POST "$MASTER_API_URL/api/release-capture" \
            -H "Authorization: Bearer $MASTER_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"kind\":\"base\",\"version\":\"${{ github.event.client_payload.version }}\",\"sourceCommit\":\"${{ github.event.client_payload.source_sha }}\"}")
          echo "$RESPONSE" > release-capture.json
          RELEASE_ID=$(python3 -c 'import json; print(json.load(open("release-capture.json"))["release"]["id"])')
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Upload artifact to License Master
        env:
          RELEASE_ID: ${{ steps.capture.outputs.release_id }}
        run: |
          set -euo pipefail
          FILE=$(find release-package -type f -name '*.tar.gz' | head -1)
          SHA=$(sha256sum "$FILE" | awk '{print $1}')
          curl --fail-with-body -sS -X POST "$MASTER_API_URL/api/v1/releases/$RELEASE_ID/artifact" \
            -H "Authorization: Bearer $MASTER_API_TOKEN" \
            -H "Content-Type: application/gzip" \
            -H "X-Artifact-SHA256: $SHA" \
            --data-binary "@$FILE"

      - name: Validate release in License Master
        env:
          RELEASE_ID: ${{ steps.capture.outputs.release_id }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST "$MASTER_API_URL/api/v1/releases/$RELEASE_ID/validate" \
            -H "Authorization: Bearer $MASTER_API_TOKEN" \
            -H "Content-Type: application/json" -d '{}'

      - name: Leave release for Billing Store admin review
        run: echo "Base release ${{ github.event.client_payload.version }} is validated in License Master and remains pending Billing Store admin approval."
