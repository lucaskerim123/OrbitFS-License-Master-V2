name: OrbitFS Base Release Pipeline

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: Base source repository
        required: true
        default: lucaskerim123/V1-vercel-base
        type: string
      source_branch:
        description: Base release branch
        required: true
        default: base-release
        type: string
      source_sha:
        description: Exact Base commit SHA
        required: true
        type: string
      version:
        description: Base release SemVer
        required: true
        type: string
  repository_dispatch:
    types: [orbitfs-base-release]

permissions:
  contents: read

env:
  MASTER_API_URL: ${{ secrets.MASTER_API_URL }}
  MASTER_API_TOKEN: ${{ secrets.MASTER_API_TOKEN }}
  SOURCE_REPO: ${{ github.event_name == 'workflow_dispatch' && inputs.source_repo || github.event.client_payload.source_repo }}
  SOURCE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.source_branch || github.event.client_payload.source_branch }}
  SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.event.client_payload.source_sha }}
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event.client_payload.version }}

concurrency:
  group: orbitfs-base-release
  cancel-in-progress: false

jobs:
  release:
    name: Capture and validate Base release
    runs-on: ubuntu-latest
    steps:
      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REPO" == "lucaskerim123/V1-vercel-base" ]] || { echo "Invalid Base release source repository."; exit 1; }
          [[ "$SOURCE_BRANCH" == "base-release" ]] || { echo "Invalid Base release source branch."; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid source commit SHA."; exit 1; }
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid SemVer version."; exit 1; }

      - name: Checkout exact Base commit
        uses: actions/checkout@v4
        with:
          repository: lucaskerim123/V1-vercel-base
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.SOURCE_GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build release artifact
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run build
          mkdir -p release-package
          tar -czf "release-package/orbitfs-base-${RELEASE_VERSION}.tar.gz" . --exclude=.git --exclude=node_modules --exclude=release-package
          sha256sum release-package/*

      - name: Capture release in License Master
        id: capture
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(curl --fail-with-body -sS -X POST "$MASTER_API_URL/api/release-capture" \
            -H "Authorization: Bearer $MASTER_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"kind\":\"base\",\"version\":\"$RELEASE_VERSION\",\"sourceCommit\":\"$SOURCE_SHA\"}")
          echo "$RESPONSE" > release-capture.json
          RELEASE_ID=$(python3 -c 'import json; print(json.load(open("release-capture.json"))["release"]["id"])')
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Upload artifact to License Master
        env:
          RELEASE_ID: ${{ steps.capture.outputs.release_id }}
        run: |
          set -euo pipefail
          FILE=$(find release-package -type f -name '*.tar.gz' | head -1)
          SHA=$(sha256sum "$FILE" | awk '{print $1}')
          curl --fail-with-body -sS -X POST "$MASTER_API_URL/api/v1/releases/$RELEASE_ID/artifact" \
            -H "Authorization: Bearer $MASTER_API_TOKEN" \
            -H "Content-Type: application/gzip" \
            -H "X-Artifact-SHA256: $SHA" \
            --data-binary "@$FILE"

      - name: Validate release in License Master
        env:
          RELEASE_ID: ${{ steps.capture.outputs.release_id }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST "$MASTER_API_URL/api/v1/releases/$RELEASE_ID/validate" \
            -H "Authorization: Bearer $MASTER_API_TOKEN" \
            -H "Content-Type: application/json" -d '{}'

      - name: Leave release for manual Billing Store review
        run: echo "Base release $RELEASE_VERSION is validated in License Master and remains pending manual Billing Store approval."
