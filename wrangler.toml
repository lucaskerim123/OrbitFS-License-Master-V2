name = "orbitfs-license-master-v2"
main = "src/index.ts"
compatibility_date = "2026-09-10"

[vars]
ENTITLEMENT_ISSUER = "orbitfs-license-master"
ENTITLEMENT_AUDIENCE = "orbitfs-runtime"
ENTITLEMENT_TTL_SECONDS = "10800"
ENTITLEMENT_GRACE_SECONDS = "604800"

[[d1_databases]]
binding = "DB"
database_name = "orbitfs-license-master-v2"
database_id = "68696bec-443c-469b-bf9b-f0b762e1bb49"

[[r2_buckets]]
binding = "RELEASES"
bucket_name = "orbitfs-license-master-releases"

[observability]
enabled = true
